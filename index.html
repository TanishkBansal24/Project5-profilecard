<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <style>
        .con {
            height: 600px;            
        }
        .box{
            height: 80%;
            width: 80%;
            display: flex;
            margin: auto;
            margin-top: 60px;
            border-radius: 20px;
            box-shadow: 10px 10px 10px;
            
            
        }
        .left,.right,.center {
           height: 100%;
            
        }
        .left{
            width: 3%;
            background-color: navy;
            border-radius: 20px;
        }
        .center{
            width: 62%;
            font-size: 60px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: navy;
            background-color:whitesmoke;
        }
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .center>h1 {
            margin-left: 10px;
        }
        .right{
            width: 35%;
            box-shadow: 10px 10px 10px;
            border-radius: 20px;
        }
        .top{
            height: 35%;
            
        }
        .bottom{
            height: 65%;
        }
        .top-in{
            height: 90%;
            background-color: navy;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
       .cirle{
            height: 140px;
            width: 140x;
            border: 5px solid navy;
            border-radius: 50%;
            position: absolute;
            top: 88px;
            right: 260px;
           
       } 
       img{ 
            height: 100%;
            width: 100%;
            border-radius: 50%;
            border: 2px solid white;

       }
        h2{
            text-align:center;
        }
       .icon{
            display: flex;
            justify-content: space-evenly;
            align-items: center;

       }
     
        .button{
            height: 20%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;

        }
        .b{
            height: 50%;
            width: 40%;
            background-color: navy;
            border-radius: 20px;
            color: white;
            text-align: center;
            line-height: 30px;    

        }
        .fa-facebook{
            color: blue;
        }
        .fa-githubP{
            color: violet;
        }
        .fa-linkdin{
            color: skyblue;
        }
        .fa-instagram{
            background: linear-gradient(red,pink,yellow);
            color: transparent;
            background-clip: text;
        }
        .fa-heart{
            color:red;
        }
        .fa-share{
            color:blue;
        }

        </style>

</head>
<body>
    <div class="con">
        <div class="box">
            <div class="left"></div>
            <div class="center">
                <h1>Profile Card UI UX Design</h1>
            </div>
            <div class="right">
                <div class="top">
                    <div class="top-in">
                        <div class="circle">
                            <img src="Capture.PNG" alt="">
                        </div>
                    </div>
                </div>
                <div class="bottom">
                    <h1>Website Developer</h1>
                    <h2>Dezyne Ecole College</h2>
                    <h2>BCA 1st Year</h2>
                    <div class="icon">
                        <i class="fa fa-brands fa-facebook"></i>
                         <i class="fa fa-brands fa-instagram"></i> 
                          <i class="fa fa-brands fa-linkdin"></i> 
                           <i class="fa fa-brands fa-Github"></i>
                            <i class="fa fa-brands fa-Behance"></i>
                    </div>
                    <div class="button">
                        <div class="b">Subscribe</div>
                        <div class="b">Message</div>
                    </div>
                    <div class="icon">
                        <i class="fa fa-brands fa-solid fa-heart></i>60.4k
                        <i class="fa fa-brands fa-solid fa-comment></i>20k
                        <i class="fa fa-brands fa-solid fa-share fa-horizontal></i>12.6
                    </div>
                </div> 
            </div>
        </div>
    </div>
    
</body>
</html>
